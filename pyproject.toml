[project]
name = "ai-chatbot"
version = "0.1.0"
description = "Simple AI Chatbot interface"
requires-python = ">=3.13"
dependencies = [
    "flask-sqlalchemy>=3.1.1",
    "flask>=3.1.2",
    "dotenv>=0.9.9",
    "google-genai>=2.10.0",
    "markdown>=3.10",
]

[dependency-groups]
lint = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "pyrefly>=1.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]
